<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Created - DisasterOS</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  html { height: 100%; }

  body {
    min-height: 100%;
    background: #05070d;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px;
    -webkit-overflow-scrolling: touch;
  }

  .phone {
    position: relative;
    width: 100%;
    max-width: 380px;
    min-height: 640px;
    background: radial-gradient(ellipse at top, #0d1524 0%, #060a13 55%, #04060c 100%);
    border-radius: 36px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0, 180, 255, 0.08), 0 20px 60px rgba(0,0,0,0.6);
    padding: 40px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  @media (max-width: 420px) {
    body { padding: 0; }
    .phone {
      max-width: 100%;
      border-radius: 0;
      min-height: 100vh;
      min-height: 100dvh;
    }
  }

  .check-circle {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, #17a3d6, #1ecbd0);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 40px rgba(30, 203, 208, 0.45);
    margin-bottom: 28px;
  }

  .title {
    color: #ffffff;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .sub {
    color: #8a94a6;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 34px;
    max-width: 280px;
  }

  .create-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(90deg, #17a3d6 0%, #1ecbd0 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 14px;
    padding: 16px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(23, 163, 214, 0.35);
    text-decoration: none;
  }

  .create-btn:hover { transform: translateY(-1px); }
</style>
</head>
<body>

<div class="phone">
  <div class="check-circle">
    <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>

  <div class="title">Account Created!</div>
  <div class="sub">Your DisasterOS account has been set up successfully. You can now log in and start making a difference.</div>

  <a class="create-btn" href="login.html">
    Continue to Login
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <polyline points="12 5 19 12 12 19"/>
    </svg>
  </a>
</div>

</body>
</html>

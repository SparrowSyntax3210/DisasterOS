          bottom: 78px;
          left: 0;
          right: 0;
          height: 130px;
          background:
            radial-gradient(
              ellipse at 30% 100%,
              rgba(40, 80, 140, 0.35),
              transparent 60%
            ),
            radial-gradient(
              ellipse at 75% 100%,
              rgba(30, 60, 110, 0.3),

            linear-gradient(

              rgba(10, 20, 35, 0) 0%,

          left: 0;
          right: 0;

            rgba(10, 16, 24, 0) 0%,
            rgba(10, 16, 24, 0.9) 40%

      >
        <div style="max-width: 480px; margin: 0 auto">
          <button
            style="
              width: 100%;
              padding: 16px 0;
              background: linear-gradient(135deg, #3f6df0, #2a52d8);
              color: #ffffff;
              border: none;
              border-radius: 16px;
              font-size: 15.5px;
              font-weight: 700;
              box-shadow: 0 10px 25px rgba(42, 82, 216, 0.45);

              font-family: inherit;

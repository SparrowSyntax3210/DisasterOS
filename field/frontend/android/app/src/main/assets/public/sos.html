<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResQGrid — SOS Emergency</title>
    <style>
      :root {
        --bg-deep: #050d1c;
        --bg-mid: #0c1f3d;
        --navy: #123058;
        --purple: #1e6fe0;
        --purple-glow: #4d9bff;
        --orange: #22c7f0;
        --orange-glow: #6fe3ff;
        --text-main: #eaf3ff;
        --text-dim: #7fa0c9;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: radial-gradient(
          circle at 50% 30%,
          var(--bg-mid) 0%,
          var(--bg-deep) 70%
        );
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--text-main);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 16px 60px;
        overflow-x: hidden;
      }

      .topbar {
        width: 100%;
        max-width: 420px;
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 40px;
      }
      .back-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--navy);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        cursor: pointer;
      }
      .topbar h1 {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }

      .stage {
        position: relative;
        width: 340px;
        height: 340px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 10px;
      }

      /* outer ambient rings around the SOS core */
      .ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(30, 111, 224, 0.18);
        animation: pulse 3.2s ease-in-out infinite;
      }
      .ring.r1 {
        width: 190px;
        height: 190px;
      }
      .ring.r2 {
        width: 250px;
        height: 250px;
        animation-delay: 0.4s;
      }
      .ring.r3 {
        width: 310px;
        height: 310px;
        animation-delay: 0.8s;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.03);
        }
      }

      /* radial option wheel */
      .wheel {
        position: absolute;
        width: 340px;
        height: 340px;
        top: 0;
        left: 0;
        pointer-events: none;
        opacity: 0;
        transform: scale(0.7);
        transition:
          opacity 0.35s ease,
          transform 0.35s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      .wheel.open {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }

      .option {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 92px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        transform: translate(-50%, -50%);
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      .option:hover {
        transform: translate(-50%, -50%) scale(1.08);
      }
      .option:hover .opt-icon {
        background: linear-gradient(145deg, var(--orange), var(--orange-glow));
        box-shadow: 0 0 22px rgba(34, 199, 240, 0.55);
        border-color: transparent;
      }

      .opt-icon {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: var(--navy);
        border: 1px solid rgba(30, 111, 224, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        box-shadow: 0 0 14px rgba(30, 111, 224, 0.25);
        transition: all 0.2s ease;
      }
      .opt-label {
        font-size: 11.5px;
        text-align: center;
        color: var(--text-dim);
        line-height: 1.25;
        font-weight: 500;
      }

      /* positions for 5 options placed evenly around the circle,
     starting at top and going clockwise, radius ~150px */
      .option[data-i="0"] {
        transform: translate(-50%, -50%) translate(0px, -150px);
      }
      .option[data-i="1"] {
        transform: translate(-50%, -50%) translate(142px, -46px);
      }
      .option[data-i="2"] {
        transform: translate(-50%, -50%) translate(88px, 121px);
      }
      .option[data-i="3"] {
        transform: translate(-50%, -50%) translate(-88px, 121px);
      }
      .option[data-i="4"] {
        transform: translate(-50%, -50%) translate(-142px, -46px);
      }

      .option[data-i="0"]:hover {
        transform: translate(-50%, -50%) translate(0px, -150px) scale(1.08);
      }
      .option[data-i="1"]:hover {
        transform: translate(-50%, -50%) translate(142px, -46px) scale(1.08);
      }
      .option[data-i="2"]:hover {
        transform: translate(-50%, -50%) translate(88px, 121px) scale(1.08);
      }
      .option[data-i="3"]:hover {
        transform: translate(-50%, -50%) translate(-88px, 121px) scale(1.08);
      }
      .option[data-i="4"]:hover {
        transform: translate(-50%, -50%) translate(-142px, -46px) scale(1.08);
      }

      /* central SOS button */
      .sos-core {
        position: relative;
        z-index: 5;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          var(--purple-glow),
          var(--purple) 60%,
          #0e4fb0 100%
        );
        border: none;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        cursor: pointer;
        box-shadow:
          0 0 0 6px rgba(30, 111, 224, 0.12),
          0 0 40px rgba(30, 111, 224, 0.55);
        transition:
          box-shadow 0.3s ease,
          transform 0.2s ease;
      }
      .sos-core:active {
        transform: scale(0.97);
      }
      .sos-core.active {
        background: radial-gradient(
          circle at 35% 30%,
          var(--orange-glow),
          var(--orange) 60%,
          #0d8fb5 100%
        );
        box-shadow:
          0 0 0 8px rgba(34, 199, 240, 0.15),
          0 0 55px rgba(34, 199, 240, 0.65);
      }
      .sos-core .sos-word {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 1px;
      }
      .sos-core .sos-sub {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.85);
        font-weight: 500;
      }

      .caption {
        margin-top: 34px;
        text-align: center;
        color: var(--text-dim);
        font-size: 13px;
        max-width: 280px;
        line-height: 1.5;
      }
      .caption b {
        color: var(--text-main);
      }

      .action-list {
        width: 100%;
        max-width: 380px;
        margin-top: 34px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .action-row {
        background: var(--navy);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 14px;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        cursor: pointer;
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }
      .action-row:hover {
        border-color: rgba(30, 111, 224, 0.4);
        background: #0e2a54;
      }
      .action-row .a-icon {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: rgba(30, 111, 224, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
      }
      .action-row .a-text {
        flex: 1;
      }
      .action-row .a-title {
        font-size: 14px;
        font-weight: 600;
      }
      .action-row .a-sub {
        font-size: 12px;
        color: var(--text-dim);
        margin-top: 2px;
      }
      .action-row .a-arrow {
        color: var(--text-dim);
        font-size: 16px;
      }

      /* toast confirming selection */
      .toast {
        position: fixed;
        bottom: 26px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--navy);
        border: 1px solid rgba(34, 199, 240, 0.5);
        color: var(--text-main);
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="back-btn">←</div>
      <h1>SOS Emergency</h1>
    </div>

    <div class="stage">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>

      <div class="wheel" id="wheel">
        <div class="option" data-i="0" onclick="selectOption('Team Backup')">
          <div class="opt-icon">👥</div>
          <div class="opt-label">Team<br />Backup</div>
        </div>
        <div class="option" data-i="1" onclick="selectOption('Medic Team')">
          <div class="opt-icon">🩺</div>
          <div class="opt-label">Medic<br />Team</div>
        </div>
        <div class="option" data-i="2" onclick="selectOption('Rescue Boat')">
          <div class="opt-icon">🚤</div>
          <div class="opt-label">Rescue<br />Boat</div>
        </div>
        <div class="option" data-i="3" onclick="selectOption('Evacuation')">
          <div class="opt-icon">🚨</div>
          <div class="opt-label">Evacuation<br />Support</div>
        </div>
        <div class="option" data-i="4" onclick="selectOption('Supplies')">
          <div class="opt-icon">📦</div>
          <div class="opt-label">Supplies</div>
        </div>
      </div>

      <button class="sos-core" id="sosBtn" onclick="toggleWheel()">
        <span class="sos-word">SOS</span>
        <span class="sos-sub" id="sosSub">Tap to Send Alert</span>
      </button>
    </div>

    <div class="caption" id="caption">
      Your location will be shared with <b>control panel and team</b>.
    </div>

    <div class="action-list">
      <div class="action-row">
        <div class="a-icon">📞</div>
        <div class="a-text">
          <div class="a-title">Call Control Room</div>
          <div class="a-sub">+91 9876543210</div>
        </div>
        <div class="a-arrow">›</div>
      </div>
      <div class="action-row" onclick="selectOption('Silent Alert')">
        <div class="a-icon">🔔</div>
        <div class="a-text">
          <div class="a-title">Send Silent Alert</div>
          <div class="a-sub">Alert team without sound</div>
        </div>
        <div class="a-arrow">›</div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    
    
       <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="./js/socket-client.js"></script>

    <script>
      // ==========================================================
      // DISASTEROS SOS
      // REST API + REAL-TIME SOCKET.IO
      // ==========================================================

      const API_BASE = "http://localhost:4000";

      // ==========================================================
      // STATE
      // ==========================================================

      let open = false;

      let selectedSOS = null;

      // Keep locally received SOS records
      let sosData = [];

      // ==========================================================
      // SOCKET CONNECTION
      // ==========================================================

      function initializeSOSSocket() {
        try {
          console.log("🔌 Connecting SOS page to DisasterOS Socket...");

          SocketService.connect();

          console.log("✅ SOS Socket connected");

          // ------------------------------------------------------
          // NEW SOS
          // ------------------------------------------------------

          SocketService.on("sos:created", (payload) => {
            console.log("🚨 REAL-TIME SOS CREATED:", payload);

            const sos = payload?.sos;

            if (!sos) {
              console.warn("⚠️ sos:created received without SOS data");
              return;
            }

            // Avoid duplicate records
            const existingIndex = sosData.findIndex(
              (item) =>
                String(item._id || item.id) === String(sos._id || sos.id),
            );

            if (existingIndex === -1) {
              sosData.unshift(sos);
            } else {
              sosData[existingIndex] = sos;
            }

            // If this SOS page is not the one that created it,
            // the socket event will still arrive here.
            showSOSNotification(sos);

            console.log("📡 SOS added through socket:", sos);

            updateSOSUI();
          });

          // ------------------------------------------------------
          // SOS UPDATED
          // ------------------------------------------------------

          SocketService.on("sos:updated", (payload) => {
            console.log("🔄 REAL-TIME SOS UPDATED:", payload);

            const sos = payload?.sos;

            if (!sos) {
              console.warn("⚠️ sos:updated received without SOS data");
              return;
            }

            const id = String(sos._id || sos.id);

            const index = sosData.findIndex(
              (item) => String(item._id || item.id) === id,
            );

            if (index !== -1) {
              sosData[index] = sos;
            } else {
              // If this page was opened after the SOS was created,
              // add it to our local state.
              sosData.unshift(sos);
            }

            showToast(
              "SOS Updated",
              `${sos.type || "Emergency"} SOS status changed to ${
                sos.status || "UPDATED"
              }`,
            );

            updateSOSUI();
          });

          // ------------------------------------------------------
          // SOS DELETED
          // ------------------------------------------------------

          SocketService.on("sos:deleted", (payload) => {
            console.log("🗑️ REAL-TIME SOS DELETED:", payload);

            const sosId = payload?.sosId;

            if (!sosId) {
              console.warn("⚠️ sos:deleted received without sosId");
              return;
            }

            sosData = sosData.filter(
              (item) => String(item._id || item.id) !== String(sosId),
            );

            showToast(
              "SOS Removed",
              "The SOS request has been removed by the response team.",
            );

            updateSOSUI();
          });
        } catch (error) {
          console.error("❌ SOS Socket initialization failed:", error);
        }
      }

      // ==========================================================
      // LOAD EXISTING SOS
      // ==========================================================

      async function loadSOS() {
        try {
          console.log("📡 Loading existing SOS requests...");

          const response = await fetch(`${API_BASE}/api/sos`);

          const data = await response.json();

          if (!response.ok) {
            throw new Error(
              data.message || `Failed to load SOS: ${response.status}`,
            );
          }

          /*
        Backend returns:

        {
          success: true,
          count: ...,
          data: [...]
        }
      */

          sosData = Array.isArray(data?.data) ? data.data : [];

          console.log("✅ Existing SOS loaded:", sosData);

          updateSOSUI();
        } catch (error) {
          console.error("❌ Failed to load SOS:", error);
        }
      }

      // ==========================================================
      // INIT
      // ==========================================================

      document.addEventListener("DOMContentLoaded", async () => {
        console.log("🚨 DisasterOS SOS page starting...");

        // Connect socket FIRST
        initializeSOSSocket();

        // Then load existing records
        await loadSOS();

        console.log("✅ SOS page initialized");
      });

      // ==========================================================
      // SOS WHEEL
      // ==========================================================

      function toggleWheel() {
        open = !open;

        const wheel = document.getElementById("wheel");
        const btn = document.getElementById("sosBtn");
        const sub = document.getElementById("sosSub");
        const caption = document.getElementById("caption");

        wheel?.classList.toggle("open", open);

        btn?.classList.toggle("active", open);

        if (sub) {
          sub.textContent = open ? "Choose a Response" : "Tap to Send Alert";
        }

        if (caption) {
          caption.innerHTML = open
            ? "Select the kind of help you need. Your location is shared automatically."
            : "Your location will be shared with <b>control panel and team</b>.";
        }
      }

      // ==========================================================
      // SELECT SOS TYPE
      // ==========================================================

      async function selectOption(name) {
        console.log("🚨 SOS selected:", name);

        // --------------------------------------------------------
        // CLOSE WHEEL
        // --------------------------------------------------------

        open = false;

        document.getElementById("wheel")?.classList.remove("open");

        document.getElementById("sosBtn")?.classList.remove("active");

        const sub = document.getElementById("sosSub");

        if (sub) {
          sub.textContent = "Tap to Send Alert";
        }

        const caption = document.getElementById("caption");

        if (caption) {
          caption.innerHTML =
            "Your location will be shared with <b>control panel and team</b>.";
        }

        // --------------------------------------------------------
        // SEND SOS
        // --------------------------------------------------------

        await createSOS(name);
      }

      // ==========================================================
      // CREATE SOS
      // ==========================================================

      async function createSOS(type) {
        try {
          showToast("Sending SOS", "Contacting DisasterOS response network...");

          // ------------------------------------------------------
          // GET LOCATION
          // ------------------------------------------------------

          const location = await getUserLocation();

          console.log("📍 SOS location:", location);

          // ------------------------------------------------------
          // PREPARE PAYLOAD
          // ------------------------------------------------------

          const payload = {
            latitude: location.latitude,

            longitude: location.longitude,

            type: type,

            severity: getSeverityFromType(type),

            description: `${type} emergency reported from field user.`,

            peopleCount: 1,

            // If you have logged-in user ID available,
            // replace this with that ID.
            reporter: getCurrentUserId(),
          };

          console.log("📤 Creating SOS:", payload);

          // ------------------------------------------------------
          // REST API
          // ------------------------------------------------------

          const response = await fetch(`${API_BASE}/api/sos`, {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify(payload),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(
              data.message || `SOS creation failed: ${response.status}`,
            );
          }

          console.log("✅ SOS created:", data);

          const createdSOS = data?.data;

          if (createdSOS) {
            // Add locally immediately.
            //
            // The socket event will also arrive, but we
            // prevent duplicates inside addSOSLocally().
            addSOSLocally(createdSOS);
          }

          // ------------------------------------------------------
          // SUCCESS
          // ------------------------------------------------------

          showToast(
            "🚨 SOS SENT",
            `${type} alert sent — response team notified.`,
          );

          // ------------------------------------------------------
          // OPTIONAL SUCCESS UI
          // ------------------------------------------------------

          const toast = document.getElementById("toast");

          if (toast) {
            toast.textContent = `🚨 ${type} alert sent — team notified`;

            toast.classList.add("show");

            setTimeout(() => {
              toast.classList.remove("show");
            }, 2600);
          }
        } catch (error) {
          console.error("❌ SOS creation failed:", error);

          showToast("SOS Failed", error.message || "Unable to send SOS.");
        }
      }

      // ==========================================================
      // ADD SOS LOCALLY
      // ==========================================================

      function addSOSLocally(sos) {
        if (!sos) return;

        const id = String(sos._id || sos.id || "");

        const exists = sosData.some(
          (item) => String(item._id || item.id || "") === id,
        );

        if (exists) {
          return;
        }

        sosData.unshift(sos);

        updateSOSUI();
      }

      // ==========================================================
      // USER LOCATION
      // ==========================================================

      function getUserLocation() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error("Geolocation is not supported by this browser."));

            return;
          }

          navigator.geolocation.getCurrentPosition(
            (position) => {
              resolve({
                latitude: position.coords.latitude,

                longitude: position.coords.longitude,

                accuracy: position.coords.accuracy,
              });
            },

            (error) => {
              console.error("GPS error:", error);

              reject(
                new Error(
                  "Unable to get your location. Please enable location access.",
                ),
              );
            },

            {
              enableHighAccuracy: true,

              timeout: 10000,

              maximumAge: 30000,
            },
          );
        });
      }

      // ==========================================================
      // SOS SEVERITY
      // ==========================================================

      function getSeverityFromType(type) {
        const value = String(type || "").toLowerCase();

        if (
          value.includes("medical") ||
          value.includes("fire") ||
          value.includes("life")
        ) {
          return "CRITICAL";
        }

        if (
          value.includes("women") ||
          value.includes("security") ||
          value.includes("danger")
        ) {
          return "HIGH";
        }

        return "HIGH";
      }

      // ==========================================================
      // CURRENT USER
      // ==========================================================

      function getCurrentUserId() {
        /*
      Adjust this according to your authentication system.

      Common examples:

      localStorage.getItem("userId")
      localStorage.getItem("user_id")
      localStorage.getItem("user")
    */

        const userId =
          localStorage.getItem("userId") || localStorage.getItem("user_id");

        return userId || null;
      }

      // ==========================================================
      // UPDATE UI
      // ==========================================================

      function updateSOSUI() {
        console.log("📊 SOS UI update:", sosData.length);

        /*
      If your SOS page has a list/container, you can render it here.

      We intentionally check for the element so this script
      doesn't break if the current HTML doesn't have one.
    */

        const container = document.getElementById("sosList");

        if (!container) {
          return;
        }

        if (!sosData.length) {
          container.innerHTML = `
        <div class="empty-message">
          No active SOS requests.
        </div>
      `;

          return;
        }

        container.innerHTML = sosData
          .map((sos) => {
            const id = sos._id || sos.id;

            return `
          <div class="sos-item" data-id="${escapeHTML(id)}">

            <strong>
              🚨 ${escapeHTML(sos.type || "Emergency")}
            </strong>

            <div>
              Severity:
              ${escapeHTML(sos.severity || "HIGH")}
            </div>

            <div>
              Status:
              ${escapeHTML(sos.status || "WAITING")}
            </div>

          </div>
        `;
          })
          .join("");
      }

      // ==========================================================
      // REAL-TIME SOS NOTIFICATION
      // ==========================================================

      function showSOSNotification(sos) {
        const type = sos?.type || "Emergency";

        const severity = sos?.severity || "HIGH";

        showToast(
          "🚨 NEW SOS ALERT",
          `${type} SOS received — Severity: ${severity}`,
        );
      }

      // ==========================================================
      // TOAST
      // ==========================================================

      function showToast(title, message) {
        const toast = document.getElementById("toast");

        const toastTitle = document.getElementById("toastTitle");

        const toastMessage = document.getElementById("toastMessage");

        // --------------------------------------------------------
        // Existing structured toast
        // --------------------------------------------------------

        if (toast) {
          if (toastTitle) {
            toastTitle.textContent = title;
          }

          if (toastMessage) {
            toastMessage.textContent = message;
          }

          toast.classList.add("show");

          setTimeout(() => {
            toast.classList.remove("show");
          }, 4000);

          return;
        }

        // --------------------------------------------------------
        // Fallback
        // --------------------------------------------------------

        console.log(`🔔 ${title}: ${message}`);
      }

      // ==========================================================
      // HTML ESCAPE
      // ==========================================================

      function escapeHTML(value) {
        if (value === null || value === undefined) {
          return "";
        }

        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      // ==========================================================
      // DEBUG
      // ==========================================================

      window.disasterOSSOS = {
        get data() {
          return sosData;
        },

        reload: loadSOS,

        send: createSOS,
      };
    </script>
  </body>
